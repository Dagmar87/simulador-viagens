services:
  db:
    image: postgres:17

    container_name: simulador_viagens_db

    restart: unless-stopped

    environment:
      POSTGRES_DB: simulador_viagens
      POSTGRES_USER: simulador
      POSTGRES_PASSWORD: simulador_password

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .

    container_name: simulador_viagens_web

    restart: unless-stopped

    command: ['python', 'manage.py', 'runserver', '0.0.0.0:8000']

    volumes:
      - .:/app

    ports:
      - '8000:8000'

    env_file:
      - .env

    depends_on:
      - db

volumes:
  postgres_data:
